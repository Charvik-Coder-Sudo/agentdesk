[pytest]
testpaths = tests
# Keep all temporary test files inside the repository (ignored by Git).
addopts = --basetemp=.pytest_tmp
filterwarnings =
    # Starlette 1.10's TestClient prefers a package named httpx2 and warns when it falls back to
    # httpx. The approved development dependency is httpx==0.28.1 (DEC-018), which works.
    ignore:Using `httpx` with `starlette.testclient` is deprecated
